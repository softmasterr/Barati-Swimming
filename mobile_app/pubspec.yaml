name: barati_swimming_app
description: "سامانه مدیریت تردد NFC و حسابداری آکادمی شنای براتی"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Hardware NFC Reading & Writing
  nfc_manager: ^3.3.0

  # Offline Local Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Networking & SMS Gateways
  http: ^1.2.2
  url_launcher: ^6.3.0

  # Haptic & Feedback
  fluttertoast: ^8.2.4
  intl: ^0.19.0

  # Modern Icons & UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
