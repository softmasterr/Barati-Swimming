name: Build Android APK (Barati Swimming)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Prepare Single Versioned Release APK
        run: |
          APP_VER=$(grep '^version:' mobile_app/pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          if [ -z "$APP_VER" ]; then
            APP_VER="1.1.0"
          fi
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          APK_NAME="barati-swimming-v${APP_VER}.apk"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=mobile_app/build/app/outputs/flutter-apk/$APK_NAME" >> $GITHUB_ENV
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "mobile_app/build/app/outputs/flutter-apk/$APK_NAME"
          echo "Successfully prepared single release APK: $APK_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barati-Swimming-v${{ env.APP_VERSION }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Clean Up Legacy Release Assets
        run: |
          gh release delete-asset "v${{ env.APP_VERSION }}-release" "app-release.apk" --yes || true
          gh release delete-asset "v${{ env.APP_VERSION }}-release" "barati-swimming-release.apk" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ env.APP_VERSION }}-release
          name: "نسخه رسمی v${{ env.APP_VERSION }} آکادمی شنای براتی (Android Release)"
          body: |
            ## 🏊‍♂️ نسخه رسمی اپلیکیشن آکادمی شنای براتی (Barati Swimming Academy)

            این نسخه مجهز به **امضای دیجیتال پایدار و ثابت (Release Keystore)** است؛ از این پس برای نصب بروزرسانی‌ها **هرگز نیازی به حذف نسخه قبلی نیست** و با نصب نسخه جدید روی نسخه قبلی، تمامی اطلاعات شناگران، تنظیمات و پایگاه‌داده محلی حفظ می‌شوند.

            ### ✨ قابلیت‌ها و تغییرات نسخه ${{ env.APP_VERSION }}:
            - **تنظیمات نام استخر در پیامک‌ها:** نمایش استخر فعال، دکمه‌های سریع درج متغیر `{pool}`، ارتقای خودکار پیامک‌های قدیمی و پیش‌نمایش زنده متن پیامک ارسالی به والدین.
            - **انتخاب هوشمند استخر فعال در ورود:** دیالوگ انتخاب استخر در شروع برنامه و نوار بالای صفحه برای تفکیک دقیق تردد شناگران و مربیان.
            - **تفکیک استخر در حسابداری و تسویه مربیان:** امکان تعیین استخر در ثبت هزینه‌ها و پرداخت دستمزد به مربیان چنداستخره.
            - **بروزرسانی مستقیم بدون حذف:** امضای یکپارچه Release Keystore و حفظ پایگاه‌داده بدون نیاز به پاک‌کردن نسخه قبلی.
            - **مدیریت دوره‌ها و پکیج‌ها در تنظیمات:** ویرایش دوره‌ها، تعداد جلسات و شهریه با اعمال خودکار در ثبت‌نام و تمدید.
            - **سیستم شارژ و تمدید دوره شناگران:** تمدید دوره، تسویه بدهی و ارسال پیامک تمدید با درج نام استخر.
            - **ارسال مستقیم پیامک از سیم‌کارت:** ارسال خودکار پیامک ورود، تمدید و یادآوری کاهش جلسات بدون نیاز به وب‌سرویس اینترنتی.
            - **محدودیت تردد زیر ۱ ساعت:** هشدار هوشمند و تایید مربی در صورت اسکن مجدد مچ‌بند در کمتر از ۶۰ دقیقه.

            ---
            ### 📥 دانلود و نصب مستقیم:
            فایل نصبی **`${{ env.APK_NAME }}`** را از بخش **Assets** در زیر دانلود کرده و مستقیماً روی گوشی یا تبلت اندروید خود نصب فرمایید.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
